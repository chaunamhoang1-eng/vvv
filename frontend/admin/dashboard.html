<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard – PlagX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/admin/dashboard.css" />

  <style>
    .admin-status {
      display: flex;
      gap: 12px;
      align-items: center;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .admin-status input {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .delete-multi {
      background: #d12323;
      padding: 8px 14px;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .delete {
      cursor: pointer;
      color: #ef4444;
      font-size: 16px;
      margin-left: 6px;
    }

    .tick {
      color: #16a34a;
      font-size: 18px;
      margin-right: 6px;
    }
  </style>
</head>

<body>

<script>
  if (!localStorage.getItem("adminToken")) {
    window.location.href = "/admin/login.html";
  }
</script>

<header>
  <h2>PlagX — Admin Dashboard</h2>
  <button onclick="logoutAdmin()">Logout</button>
</header>

<div class="container">

  <div class="stats">
    <div class="card"><h3>Total Orders</h3><p id="totalOrders">0</p></div>
    <div class="card"><h3>Pending</h3><p id="pendingOrders">0</p></div>
    <div class="card"><h3>Completed</h3><p id="completedOrders">0</p></div>
    <div class="card"><h3>My Completed</h3><p id="myCompleted">0</p></div>
  </div>

  <div class="admin-status">
    <label>From: <input type="date" id="fromDate" /></label>
    <label>To: <input type="date" id="toDate" /></label>
    <button onclick="loadMyStats()">Filter</button>
  </div>

  <button class="delete-multi" onclick="deleteSelected()">Delete Selected</button>

  <table>
    <thead>
      <tr>
        <th>View</th>
        <th>Document Name</th>
        <th>Date</th>
        <th>Status</th>
        <th>AI</th>
        <th>Plag</th>
        <th>
          <input type="checkbox" id="selectAll" onclick="toggleSelectAll()" />
          Select All
        </th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="ordersTable"></tbody>
  </table>

</div>

<script src="/admin/dashboard.js"></script>

</body>
</html>
