<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard – PlagX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- CSS -->
  <link rel="stylesheet" href="dashboard.css" />
</head>

<body>

<!-- ================= MOBILE TOP BAR ================= -->
<header class="mobile-header">
  <button class="menu-btn" onclick="openDrawer()">☰</button>
  <span class="mobile-title">PlagX</span>
  <button class="theme-btn" onclick="toggleTheme()">🌙</button>
</header>

<!-- ================= DESKTOP SIDEBAR ================= -->
<aside class="sidebar" id="sidebar">
  <h2 class="brand">PlagX</h2>

  <nav>
    <a class="active">Dashboard</a>
    <a id="creditItem">Credits: —</a>
    <a onclick="redirectToPurchase()">Purchase / Plans</a>
    <a onclick="openAccount()">My Account</a>
  </nav>

  <button class="logout-btn" onclick="logout()">Logout</button>
</aside>

<!-- ================= MOBILE DRAWER ================= -->
<aside class="mobile-drawer" id="mobileDrawer">
  <h3 class="drawer-title">PlagX</h3>

  <a class="active">Dashboard</a>
  <a id="creditItemMobile">Credits: —</a>
  <a onclick="redirectToPurchase()">Purchase / Plans</a>
  <a onclick="openAccount()">My Account</a>
  <a onclick="logout()">Sign Out</a>
</aside>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>

<!-- ================= MAIN CONTENT ================= -->
<main class="main">

  <!-- DESKTOP HEADER -->
  <header class="desktop-header">
    <h1>Dashboard</h1>

    <div class="header-actions">
      <button
        class="discord-btn"
        onclick="window.open('https://discord.gg/YOUR_LINK','_blank')"
      >
        Join Discord
      </button>

      <button class="account-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- UPLOAD (replaced dynamically by dashboard.js) -->
  <section class="upload-section"></section>

  <!-- REPORTS -->
  <section class="results-section">
    <h2>Your Recent Reports</h2>

    <table>
      <thead>
        <tr>
          <th>Document</th>
          <th>AI</th>
          <th>Plagiarism</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="reportTable">
        <!-- injected by dashboard.js -->
      </tbody>
    </table>
  </section>
</main>

<!-- ================= ACCOUNT PANEL ================= -->
<div class="account-panel" id="accountPanel">
  <div class="account-header">
    <h3>My Account</h3>
    <span class="close-btn" onclick="closeAccount()">×</span>
  </div>

  <div class="account-body">
    <p>
      <strong>Email</strong><br />
      <span id="accEmail">—</span>
    </p>

    <p>
      <strong>Credits</strong><br />
      <span id="accCredits">—</span>
    </p>

    <button class="danger-btn" onclick="deleteAccount()">
      Delete My Account
    </button>
  </div>
</div>

<!-- ================= MOBILE BOTTOM NAV ================= -->
<nav class="bottom-nav">
  <button class="active">Dashboard</button>
  <button onclick="redirectToPurchase()">Plans</button>
  <button onclick="openAccount()">Account</button>
</nav>

<!-- ================= MAIN LOGIC ================= -->
<script type="module" src="dashboard.js"></script>

<!-- ================= THEME + DRAWER SCRIPT ================= -->
<script>
  function toggleTheme() {
    document.body.classList.toggle("light");
    localStorage.setItem(
      "theme",
      document.body.classList.contains("light") ? "light" : "dark"
    );
  }

  (function initTheme() {
    const saved = localStorage.getItem("theme");
    if (saved === "light") document.body.classList.add("light");
  })();

  function openDrawer() {
    document.getElementById("mobileDrawer").classList.add("open");
    document.getElementById("overlay").classList.add("show");
  }

  function closeDrawer() {
    document.getElementById("mobileDrawer").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
  }
</script>

</body>
</html>
