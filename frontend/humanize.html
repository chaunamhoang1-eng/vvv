
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Humanizer Pro – plagxdetector.com</title>

  <link rel="stylesheet" href="humanize.css" />
</head>

<body>
  <div class="container">
    <h1 class="title">
      AI <span>Humanizer Pro</span>
    </h1>

    <div class="box">
      <textarea
        id="inputText"
        placeholder="Paste your text here (minimum 10 words)…"
        aria-label="Text to humanize"
        minlength="1"
      ></textarea>

      <div class="controls">
        <label for="toneSelect">Writing style</label>

        <select id="toneSelect" name="tone">
          <option value="Standard">Standard</option>
          <option value="Casual">Casual</option>
          <option value="Professional" selected>Professional</option>
          <option value="Academic">Academic</option>
        </select>
      </div>

      <button
        type="button"
        class="btn"
        id="humanizeButton"
        onclick="humanizeText()"
      >
        Humanize Text
      </button>

      <div
        id="resultBox"
        aria-live="polite"
        aria-atomic="true"
      ></div>
    </div>
  </div>

  <!-- Reuse the existing Firebase app configuration. -->
  <script type="module">
    import {
      initializeApp,
      getApps
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

    import {
      getAuth,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAbvVgUW6H3sJBY3Sng7JSCzyBFN1PxrnQ",
      authDomain: "login-98c26.firebaseapp.com",
      projectId: "login-98c26",
      storageBucket: "login-98c26.firebasestorage.app",
      messagingSenderId: "199892612420",
      appId: "1:199892612420:web:db0aeb5bd145f335955311"
    };

    try {
      const app = getApps().length
        ? getApps()[0]
        : initializeApp(firebaseConfig);

      const auth = getAuth(app);

      await setPersistence(auth, browserLocalPersistence);

      window.auth = auth;

      console.log("Humanizer Firebase initialized");
    } catch (error) {
      console.error("Firebase initialization failed:", error);
    }
  </script>

  <script src="humanize.js"></script>
</body>
</html>
