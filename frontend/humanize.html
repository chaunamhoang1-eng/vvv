<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Humanizer Pro – plagxdetector.com</title>

  <link rel="stylesheet" href="humanize.css" />
</head>

<body>
  <div class="container">
    <h1 class="title">
      AI <span>Humanizer Pro</span>
    </h1>

    <div class="box">
      <textarea
        id="inputText"
        placeholder="Paste your AI-generated text here (minimum 50 words)…"
      ></textarea>

      <div class="controls">
        <select id="toneSelect">
          <option value="Standard">Standard</option>
          <option value="Casual">Casual</option>
          <option value="Professional">Professional</option>
          <option value="Academic">Academic</option>
        </select>
      </div>

      <button
        type="button"
        class="btn"
        onclick="humanizeText()"
      >
        Humanize Text
      </button>

      <div id="resultBox" aria-live="polite"></div>
    </div>
  </div>

  <!-- Reuse the existing Firebase app configuration.
       Do not initialize a second Firebase app here. -->
  <script type="module">
    import {
      getApp
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

    import {
      getAuth
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

    try {
      const app = getApp();
      window.auth = getAuth(app);

      console.log(
        "Humanizer Firebase project:",
        app.options.projectId
      );
    } catch (error) {
      console.error(
        "Could not access the existing Firebase app:",
        error
      );
    }
  </script>

  <script src="humanize.js"></script>
</body>
</html>
