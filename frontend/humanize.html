<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Humanizer Pro – plagxdetector.com</title>

  <link rel="stylesheet" href="humanize.css" />
</head>

<body>
  <div class="container">
    <h1 class="title">
      AI <span>Humanizer Pro</span>
    </h1>

    <div class="box">
      <textarea
        id="inputText"
        placeholder="Paste your AI-generated text here (minimum 50 words)…"
      ></textarea>

      <div class="controls">
        <select id="toneSelect">
          <option value="Standard">Standard</option>
          <option value="Casual">Casual</option>
          <option value="Professional">Professional</option>
          <option value="Academic">Academic</option>
        </select>
      </div>

      <button
        type="button"
        class="btn"
        onclick="humanizeText()"
      >
        Humanize Text
      </button>

      <div id="resultBox" aria-live="polite"></div>
    </div>
  </div>

  <!-- Firebase initialization -->
  <script type="module">
    import { initializeApp, getApps }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import { getAuth }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    // Replace these placeholders with your existing Firebase web config.
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
      projectId: "YOUR_FIREBASE_PROJECT_ID",
      appId: "YOUR_FIREBASE_APP_ID"
    };

    const app = getApps().length
      ? getApps()[0]
      : initializeApp(firebaseConfig);

    window.auth = getAuth(app);

    window.dispatchEvent(new Event("firebase-auth-ready"));
  </script>

  <script src="humanize.js"></script>
</body>
</html>
