<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register – PlagX</title>

  <link rel="stylesheet" href="register.css">

  <!-- ================= FIREBASE CONFIG ================= -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

    import {
      getAuth
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAbvVgUW6H3sJBY3Sng7JSCzyBFN1PxrnQ",
      authDomain: "login-98c26.firebaseapp.com",
      projectId: "login-98c26",
      storageBucket: "login-98c26.firebasestorage.app",
      messagingSenderId: "199892612420",
      appId: "1:199892612420:web:db0aeb5bd145f335955311",
      measurementId: "G-NCHVRBDE1D"
    };

    const app = initializeApp(firebaseConfig);

    window.auth = getAuth(app);

  </script>
  <!-- ==================================================== -->

</head>

<body>

<div class="container">

  <h2 class="title">Create an Account</h2>

  <p class="subtitle">
    Sign up to continue to your dashboard
  </p>


  <!-- ==================================================
       REGISTER FORM
  =================================================== -->

  <form id="registerForm">

    <label>Email</label>

    <div class="input-box">

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

    </div>


    <label>Password</label>

    <div class="input-box password-box">

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <span
        class="toggle"
        onclick="togglePassword()"
      >
        👁
      </span>

    </div>


    <button
      class="btn"
      type="submit"
      id="registerBtn"
    >
      Register →
    </button>

  </form>


  <!-- ==================================================
       OTP VERIFICATION
  =================================================== -->

  <div
    id="otpBox"
    class="hidden"
  >

    <p>
      We sent a 6-digit verification code to:
    </p>

    <strong id="otpEmail"></strong>


    <div class="input-box">

      <input
        type="text"
        id="otp"
        placeholder="Enter 6-digit OTP"
        inputmode="numeric"
        maxlength="6"
        autocomplete="one-time-code"
      >

    </div>


    <button
      class="btn"
      type="button"
      id="verifyOtpBtn"
    >
      Verify OTP
    </button>


    <button
      type="button"
      id="resendOtpBtn"
      disabled
      style="margin-top:10px;"
    >
      Resend OTP (<span id="countdown">60</span>s)
    </button>


    <p
      id="otpMessage"
      style="margin-top:15px;"
    ></p>

  </div>


  <!-- ==================================================
       SUCCESS
  =================================================== -->

  <div
    id="successBox"
    class="success hidden"
  >
    ✔ Account Created Successfully!
  </div>


  <p class="login-text">

    Already have an account?

    <a href="/login.html">
      Login here
    </a>

  </p>

</div>


<!-- Register Script -->

<script
  type="module"
  src="register.js"
></script>


</body>
</html>
