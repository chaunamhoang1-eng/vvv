<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Purchase History – PlagX Detector</title>

  <link
    rel="stylesheet"
    href="dashboard.css">

  <style>
    .purchase-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 25px;
    }

    .purchase-page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .purchase-page-header h1 {
      margin: 0;
    }

    .purchase-page-header p {
      margin-top: 8px;
      opacity: 0.7;
    }

    .purchase-actions {
      display: flex;
      gap: 10px;
    }

    .history-btn {
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 14px;
    }

    .back-btn {
      background: #252d50;
      color: white;
    }

    .refresh-history-btn {
      background: #4b8df8;
      color: white;
    }

    .purchase-history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .purchase-row {
      display: grid;
      grid-template-columns:
        minmax(220px, 2fr)
        1fr
        1fr
        1fr;

      align-items: center;
      gap: 20px;

      padding: 20px;

      border-radius: 12px;

      background: rgba(35, 45, 82, 0.8);

      border: 1px solid rgba(255,255,255,0.08);
    }

    .purchase-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .purchase-info strong {
      font-size: 16px;
    }

    .purchase-info small {
      opacity: 0.65;
    }

    .purchase-credits {
      font-weight: 600;
    }

    .purchase-amount {
      font-weight: 600;
    }

    .purchase-status {
      color: #62d98b;
      font-weight: 600;
    }

    .purchase-loading,
    .no-purchases,
    .purchase-error {
      padding: 35px;
      text-align: center;
      border-radius: 12px;
      background: rgba(35, 45, 82, 0.8);
    }

    .purchase-error {
      color: #ff6b6b;
    }

    .retry-history-btn {
      margin-left: 10px;
      padding: 8px 14px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    @media (max-width: 700px) {

      .purchase-page {
        padding: 25px 15px;
      }

      .purchase-page-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .purchase-actions {
        width: 100%;
      }

      .history-btn {
        flex: 1;
      }

      .purchase-row {
        grid-template-columns: 1fr;
        gap: 12px;
      }

    }
  </style>

</head>


<body>


  <main class="purchase-page">


    <!-- ================= HEADER ================= -->

    <div class="purchase-page-header">

      <div>

        <h1>
          Purchase History
        </h1>

        <p>
          Your previous PlagX purchases
        </p>

      </div>


      <div class="purchase-actions">

        <button
          class="history-btn back-btn"
          onclick="window.close()">

          ← Close

        </button>


        <button
          class="history-btn refresh-history-btn"
          onclick="loadPurchaseHistory()">

          ↻ Refresh

        </button>

      </div>

    </div>


    <!-- ================= HISTORY ================= -->

    <div
      id="purchaseHistoryList"
      class="purchase-history-list">

      <div class="purchase-loading">

        Loading purchase history...

      </div>

    </div>


  </main>


  <!-- ================= JAVASCRIPT ================= -->

  <script
    type="module"
    src="purchase-history.js">
  </script>


</body>

</html>
