<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sudoku Game – plagxdetector.com</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="game.css" />
<link rel="stylesheet" href="dashboard.css" />
</head>

<body>

<!-- ================ SIDEBAR ================ -->
<aside class="sidebar">
  <h2 class="brand"><a href="dashboard.html" style="color:white;text-decoration:none;">plagxdetector.com</a></h2>

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="leaderboard.html">🏆 Leaderboard</a>
    <a class="active" href="game.html">🎮 Play Game</a>
  </nav>
</aside>

<!-- ================ MAIN GAME AREA ================ -->
<div class="game-container">

  <h1>🎮 Sudoku Game</h1>

  <div class="controls">
      <label>Nickname:</label>
      <input id="nickname" placeholder="your name" style="padding:6px 10px;width:150px;" />

      <label style="margin-left:20px;">Difficulty:</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>

      <button class="btn" onclick="newGame()">New Game</button>
      <button class="btn" onclick="solve()">Solve</button>

      <span id="timer">⏳ Timer: 00:00</span>
      <span id="mistakes">Mistakes: 0/5</span>
  </div>

  <div id="board"></div>
</div>

<!-- ================ POPUP ================ -->
<div id="victoryPopup">
  <h2>🎉 Puzzle Solved!</h2>
  <p id="finalTime"></p>
  <p id="finalMistakes"></p>

  <button class="btn" onclick="closeVictory()">Close</button>
  <br><br>
  <a href="leaderboard.html" style="color:#00ffaa;">View Leaderboard →</a>
</div>

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<!-- Sudoku Logic -->
<script src="game.js"></script>

</body>
</html>
