<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sudoku Game – plagxdetector.com</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- CSS -->
<link rel="stylesheet" href="game.css">

</head>
<body>

<!-- ============ LEFT SIDEBAR (already existing in your project) ============ -->
<aside class="sidebar">
    <h2 class="brand">
        <a href="/">plagxdetector.com</a>
    </h2>

    <nav>
        <a onclick="window.location.href='/dashboard.html'">Dashboard</a>
        <a onclick="window.location.href='/leaderboard.html'">🏆 Leaderboard</a>
        <a class="active">🎮 Play Game</a>
    </nav>

    <button class="logout-btn" onclick="window.location.href='/login.html'">Logout</button>
</aside>

<!-- ============ MAIN GAME AREA ============ -->
<div class="game-container">

    <h1 class="title">🎮 Sudoku Game</h1>

    <!-- CONTROLS -->
    <div class="controls">

        <label>Nickname:</label>
        <input id="nickname" value="your name" placeholder="Enter name">

        <label style="margin-left:20px;">Difficulty:</label>
        <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
        </select>

        <button class="btn" onclick="newGame()">New Game</button>
        <button class="btn" onclick="solve()">Solve</button>

        <span id="timer">⏳ Timer: 00:00</span>
        <span id="mistakes">Mistakes: 0/5</span>
    </div>

    <!-- BOARD -->
    <div id="board"></div>

</div>

<!-- JS -->
<script src="game.js"></script>

</body>
</html>
