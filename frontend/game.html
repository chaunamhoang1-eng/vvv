<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Sudoku 6×6 – plagxdetector.com</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="game.css">
<link rel="stylesheet" href="dashboard.css">

</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <h2 class="brand"><a href="dashboard.html">plagxdetector.com</a></h2>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="leaderboard.html">🏆 Leaderboard</a>
    <a class="active">🎮 Play Game</a>
  </nav>
</aside>

<!-- MAIN GAME AREA -->
<div class="game-container">

  <h1 class="title">🎮 Mini Sudoku (6×6)</h1>

  <div class="controls">
    <label>Nickname:</label>
    <input id="nickname" placeholder="Your name">

    <label style="margin-left:20px;">Difficulty:</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>

    <button class="btn" onclick="newGame()">New Game</button>
    <button class="btn" onclick="solve()">Solve</button>
    <button class="btn" onclick="toggleNight()">🌙 Mode</button>

    <span id="timer">⏳ 00:00</span>
    <span id="mistakes">Mistakes: 0/5</span>
  </div>

  <div id="board"></div>

</div>

<!-- WIN POPUP -->
<div id="popup">
  <h2>🎉 You Win!</h2>
  <p id="finalTime"></p>
  <button class="btn" onclick="closePopup()">Close</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti"></script>
<script src="game.js"></script>

</body>
</html>
