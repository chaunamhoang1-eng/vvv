<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Sudoku 6×6 – plagxdetector.com</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="game-container">

  <h1 class="title">🎮 Mini Sudoku (6×6)</h1>

  <div class="controls">
    <label>Nickname:</label>
    <input id="nickname" placeholder="Your name">

    <label style="margin-left:20px;">Difficulty:</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>

    <button class="btn" onclick="newGame()">New Game</button>
    <button class="btn" onclick="solve()">Solve</button>
    <button class="btn" onclick="toggleNight()">🌙 Mode</button>

    <span id="timer">⏳ 00:00</span>
    <span id="mistakes">Mistakes: 0/5</span>
  </div>

  <div id="board"></div>

</div>

<!-- POPUP -->
<div id="popup">
  <h2 id="popupTitle"></h2>
  <p id="finalTime"></p>
  <button class="btn" onclick="closePopup()">Close</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti"></script>
<script src="game.js"></script>

</body>
</html>
