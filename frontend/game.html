<script>
/* -------------------- GLOBAL VARIABLES -------------------- */
let puzzle = [];
let solution = [];
let seconds = 0;
let mistakes = 0;
let maxMistakes = 5;
let notesMode = false;
let undoStack = [];
let redoStack = [];

const clickSound = new Audio("https://cdn.pixabay.com/download/audio/2023/03/01/audio_0a1e74f064.mp3?filename=ui-click-124467.mp3");
const correctSound = new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_33f99a9db4.mp3?filename=correct-2-46134.mp3");
const errorSound = new Audio("https://cdn.pixabay.com/download/audio/2021/09/28/audio_9275480b5b.mp3?filename=error-2-126514.mp3");
let soundOn = true;

/* -------------------- TIMER -------------------- */
setInterval(() => {
  seconds++;
  let m = String(Math.floor(seconds / 60)).padStart(2, "0");
  let s = String(seconds % 60).padStart(2, "0");
  document.getElementById("timer").innerHTML = `⏳ Timer: ${m}:${s}`;
}, 1000);


/* -------------------- LOAD NEW GAME -------------------- */
async function newGame() {
  const diff = document.getElementById("difficulty").value;

  const res = await fetch(`https://sudoku-api.deta.dev/?difficulty=${diff}`);
  const data = await res.json();

  puzzle = data.board.map(r => r.map(v => String(v)));
  solution = data.solution.map(r => r.map(v => String(v)));

  seconds = 0;
  mistakes = 0;
  undoStack = [];
  redoStack = [];

  document.getElementById("mistakes").innerHTML = `Mistakes: 0/${maxMistakes}`;

  renderBoard();
}


/* -------------------- RENDER BOARD -------------------- */
function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";

  for (let r = 0; r < 9; r++) {
    const row = document.createElement("div");
    row.className = "row";

    for (let c = 0; c < 9; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.row = r;
      cell.dataset.col = c;

      const input = document.createElement("input");

      /* Pre-filled cell */
      if (puzzle[r][c] !== "0") {
        input.value = puzzle[r][c];
        input.disabled = true;
        input.style.fontWeight = "bold";
        cell.classList.add("given");
      }

      /* INPUT EVENTS */
      input.addEventListener("focus", () => {
        if (soundOn) clickSound.play();
        highlightCell(r, c, input.value);
      });

      /* Typing */
      input.oninput = () => {
        input.value = input.value.replace(/[^1-9]/g, "");

        saveUndoState();

        if (notesMode) {
          input.classList.add("note-mode");
          return;
        }

        checkValue(r, c, input);
      };

      cell.appendChild(input);
      row.appendChild(cell);
    }

    board.appendChild(row);
  }
}


/* -------------------- HIGHLIGHTING -------------------- */
function highlightCell(row, col, num) {
  document.querySelectorAll(".cell").forEach(cell => {
    cell.classList.remove("active", "same-number");

    let r = cell.dataset.row;
    let c = cell.dataset.col;

    /* Highlight row + column */
    if (r == row || c == col) {
      cell.classList.add("active");
    }

    /* Highlight box */
    if (Math.floor(r / 3) === Math.floor(row / 3) &&
        Math.floor(c / 3) === Math.floor(col / 3)) {
      cell.classList.add("active");
    }

    /* Highlight same numbers */
    if (cell.querySelector("input").value === num && num !== "") {
      cell.classList.add("same-number");
    }
  });
}


/* -------------------- CHECK INPUT -------------------- */
function checkValue(r, c, input) {
  if (input.value === solution[r][c]) {
    input.classList.remove("wrong");
    if (soundOn) correctSound.play();
    checkWin();
  } else {
    input.classList.add("wrong");
    mistakes++;
    document.getElementById("mistakes").innerHTML = `Mistakes: ${mistakes}/${maxMistakes}`;
    if (soundOn) errorSound.play();

    if (mistakes >= maxMistakes) {
      alert("❌ Game Over! Too many mistakes.");
      solve();
    }
  }
}


/* -------------------- HINT -------------------- */
function hint() {
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      let cell = document.querySelector(`[data-row="${r}"][data-col="${c}"] input`);
      if (cell.value === "") {
        cell.value = solution[r][c];
        cell.classList.remove("wrong");
        if (soundOn) correctSound.play();
        highlightCell(r, c, cell.value);
        return;
      }
    }
  }
}


/* -------------------- SOLVE -------------------- */
function solve() {
  const inputs = document.querySelectorAll(".cell input");
  let i = 0;

  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      inputs[i].value = solution[r][c];
      inputs[i].classList.remove("wrong");
      i++;
    }
  }
}


/* -------------------- CHECK WIN -------------------- */
function checkWin() {
  const inputs = document.querySelectorAll(".cell input");
  for (let i = 0; i < inputs.length; i++) {
    if (inputs[i].value !== solution[Math.floor(i / 9)][i % 9])
      return;
  }

  showConfetti();
}


/* -------------------- CONFETTI -------------------- */
function showConfetti() {
  alert("🎉 Congratulations! You solved the puzzle!");
}


/* -------------------- NOTES MODE -------------------- */
function toggleNotes() {
  notesMode = !notesMode;
  document.getElementById("notesBtn").style.background =
    notesMode ? "#ffaa33" : "#5b5fff";
}


/* -------------------- UNDO / REDO -------------------- */
function saveUndoState() {
  const grid = [...document.querySelectorAll(".cell input")].map(i => i.value);
  undoStack.push(grid);
}

function undo() {
  if (undoStack.length === 0) return;
  redoStack.push([...document.querySelectorAll(".cell input")].map(i => i.value));
  const values = undoStack.pop();

  applyGrid(values);
}

function redo() {
  if (redoStack.length === 0) return;
  undoStack.push([...document.querySelectorAll(".cell input")].map(i => i.value));
  const values = redoStack.pop();
  applyGrid(values);
}

function applyGrid(values) {
  const inputs = document.querySelectorAll(".cell input");
  values.forEach((v, i) => inputs[i].value = v);
}


/* ---------------- SOUND TOGGLE ------------------ */
function toggleSound() {
  soundOn = !soundOn;
  document.getElementById("soundBtn").innerHTML = soundOn ? "🔊 Sound On" : "🔇 Sound Off";
}


/* ---------------- START GAME -------------------- */
newGame();
</script>
