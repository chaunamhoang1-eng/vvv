<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sudoku Game – plagxdetector.com</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="dashboard.css" />

<style>
  body {
    background: #0d0f1a;
    color: white;
    font-family: Poppins, Arial;
    margin: 0;
    padding: 0;
    display: flex;
  }

  .game-container {
    margin-left: 260px;
    width: 100%;
    padding: 40px;
  }

  .btn {
    background: #5b5fff;
    padding: 10px 20px;
    border-radius: 7px;
    color: white;
    border: none;
    cursor: pointer;
    margin-right: 7px;
    font-size: 16px;
  }

  #board {
    margin-top: 25px;
    border: 3px solid #777;
    display: inline-block;
  }

  .row { display: flex; }

  .cell {
    width: 52px;
    height: 52px;
    border: 1px solid #444;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  input {
    width: 100%;
    height: 100%;
    background: transparent;
    color: white;
    border: none;
    text-align: center;
    font-size: 22px;
  }

  .active { background: rgba(60,80,180,0.35) !important; }
  .same-number { background: rgba(180,80,240,0.35) !important; }
  .given { background: rgba(255,255,255,0.1) !important; }
  .wrong { background: rgba(255,60,60,0.9) !important; }

  /* Popup */
  #victoryPopup {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #1b1f30;
    padding: 30px;
    width: 320px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 0 25px #00ffaa;
    z-index: 9999;
  }
</style>
</head>

<body>

<aside class="sidebar">
  <h2 class="brand"><a href="dashboard.html">plagxdetector.com</a></h2>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="leaderboard.html">🏆 Leaderboard</a>
    <a class="active" href="game.html">🎮 Play Game</a>
  </nav>
</aside>

<div class="game-container">

  <h1>🎮 Sudoku Game</h1>

  Nickname:
  <input id="nickname" style="padding:6px 10px; width:150px;" placeholder="your name" />

  <br><br>

  Difficulty:
  <select id="difficulty">
    <option value="easy">Easy</option>
    <option value="medium">Medium</option>
    <option value="hard">Hard</option>
  </select>

  <button class="btn" onclick="newGame()">New Game</button>
  <button class="btn" onclick="solve()">Solve</button>

  <span id="timer">⏳ Timer: 00:00</span>
  <span id="mistakes" style="margin-left:10px;">Mistakes: 0/5</span>

  <div id="board"></div>
</div>

<!-- WIN POPUP -->
<div id="victoryPopup">
  <h2>🎉 Puzzle Solved!</h2>
  <p id="finalTime"></p>
  <p id="finalMistakes"></p>

  <button class="btn" onclick="closeVictory()">Close</button>
  <br><br>
  <a href="leaderboard.html" style="color:#00ffaa;">View Leaderboard →</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
let puzzle = [], solution = [];
let seconds = 0, mistakes = 0;

setInterval(() => {
  seconds++;
  let m = String(Math.floor(seconds / 60)).padStart(2,"0");
  let s = String(seconds % 60).padStart(2,"0");
  document.getElementById("timer").innerHTML = `⏳ Timer: ${m}:${s}`;
}, 1000);

/* New Game */
async function newGame() {
  const res = await fetch("https://sudoku-api.vercel.app/api/dosuku?query=gen");
  const data = await res.json();

  const grid = data.newboard.grids[0];
  puzzle = grid.value.map(r => r.map(v => String(v)));
  solution = grid.solution.map(r => r.map(v => String(v)));

  seconds = 0;
  mistakes = 0;
  document.getElementById("mistakes").innerText = "Mistakes: 0/5";
  renderBoard();
}

/* Render Board */
function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";

  for (let r = 0; r < 9; r++) {
    const row = document.createElement("div");
    row.className = "row";

    for (let c = 0; c < 9; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const input = document.createElement("input");

      if (puzzle[r][c] !== "0") {
        input.value = puzzle[r][c];
        input.disabled = true;
        cell.classList.add("given");
      }

      input.oninput = () => {
        input.value = input.value.replace(/[^1-9]/g, "");
        checkValue(r, c, input);
      };

      cell.appendChild(input);
      row.appendChild(cell);
    }

    board.appendChild(row);
  }
}

/* Check Input */
function checkValue(r, c, input) {
  if (input.value === solution[r][c]) {
    input.classList.remove("wrong");
    checkWin();
  } else {
    input.classList.add("wrong");
    mistakes++;
    document.getElementById("mistakes").innerText = `Mistakes: ${mistakes}/5`;
  }
}

/* Win */
async function checkWin() {
  const inputs = document.querySelectorAll(".cell input");
  for (let i = 0; i < inputs.length; i++) {
    if (inputs[i].value !== solution[Math.floor(i/9)][i%9]) return;
  }

  // Confetti
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      confetti({ particleCount: 100, spread: 80 });
    }, i * 170);
  }

  // Glow
  document.getElementById("board").style.boxShadow =
    "0 0 30px 10px rgba(0,255,150,0.8)";

  // Popup
  document.getElementById("finalTime").innerText = `⏱ Time: ${seconds}s`;
  document.getElementById("finalMistakes").innerText = `❌ Mistakes: ${mistakes}`;
  document.getElementById("victoryPopup").style.display = "block";

  // SAVE SCORE TO BACKEND
  const nickname = document.getElementById("nickname").value || "Player";
  const email = localStorage.getItem("email") || "guest@example.com";

  await fetch("/api/sudoku/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email,
      nickname,
      difficulty: document.getElementById("difficulty").value,
      time: seconds,
      mistakes
    })
  });
}

function closeVictory() {
  document.getElementById("victoryPopup").style.display = "none";
}

newGame();
</script>

</body>
</html>
